<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Quiz ICF — Competenze Core</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue-deep:   #0a0f2e;
      --blue-mid:    #111a4d;
      --blue-card:   #151d52;
      --blue-border: rgba(120,140,255,.15);
      --gold:        #fbbf24;
      --gold-glow:   rgba(251,191,36,.18);
      --teal:        #2dd4bf;
      --teal-soft:   rgba(45,212,191,.12);
      --text:        #e8ecff;
      --muted:       #8b96cc;
      --ok:          #34d399;
      --bad:         #f87171;
      --font-h:     'Playfair Display', Georgia, serif;
      --font-b:     'Plus Jakarta Sans', system-ui, sans-serif;
      --radius:      16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0a0f2e;
      background-image:
        radial-gradient(ellipse 80vw 50vh at 0% 0%,   rgba(99,102,241,.22) 0%, transparent 70%),
        radial-gradient(ellipse 60vw 40vh at 100% 80%, rgba(251,191,36,.13) 0%, transparent 70%),
        radial-gradient(ellipse 50vw 60vh at 80%  20%, rgba(45,212,191,.09) 0%, transparent 60%);
      background-attachment: fixed;
    }

    body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;          /* blocca lo scroll a livello pagina */
      display: flex;
      flex-direction: column;
      background: transparent;
      color: var(--text);
      font-family: var(--font-b);
      -webkit-font-smoothing: antialiased;
    }

    /* ─── HEADER ─── */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(10,15,46,.75);
      border-bottom: 1px solid var(--blue-border);
      padding: 10px 16px;
      flex-shrink: 0;
    }

    .h-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .h-logo {
      font-family: var(--font-h);
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--gold), var(--teal));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
    }

    .h-stats {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .stat-chip {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--blue-border);
      white-space: nowrap;
    }
    .stat-chip.ok-chip { color: var(--ok); }
    .stat-chip.bad-chip { color: var(--bad); }
    .stat-chip.pct-chip { color: var(--gold); }

    .progress-track {
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,.1);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--teal), var(--gold));
      border-radius: 999px;
      transition: width .4s cubic-bezier(.4,0,.2,1);
    }

    /* ─── MAIN ─── */
    main {
      flex: 1;
      min-height: 0;             /* fondamentale: permette al flex child di shrink */
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 14px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* ─── WELCOME ─── */
    .welcome-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
      padding: 24px 0 8px;
    }

    .welcome-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(251,191,36,.35);
      background: var(--gold-glow);
      font-size: 12px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: .5px;
    }

    .welcome-supertitle {
      font-family: var(--font-b);
      font-size: clamp(13px, 3.5vw, 16px);
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--teal);
      opacity: .85;
    }

    .welcome-title {
      font-family: var(--font-h);
      font-size: clamp(28px, 8vw, 44px);
      line-height: 1.1;
      background: linear-gradient(135deg, #fff 30%, var(--teal));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .welcome-text {
      font-size: 14px;
      line-height: 1.7;
      color: var(--muted);
      max-width: 440px;
      text-align: left;
    }

    .welcome-text li {
      margin-bottom: 6px;
      list-style: none;
      padding-left: 20px;
      position: relative;
    }
    .welcome-text li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: var(--teal);
      font-weight: 700;
    }

    .info-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .info-pill {
      padding: 8px 14px;
      border-radius: var(--radius);
      background: rgba(255,255,255,.04);
      border: 1px solid var(--blue-border);
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }
    .info-pill strong { color: var(--text); display: block; font-size: 18px; }

    .credit {
      font-size: 11px;
      color: var(--muted);
      opacity: .7;
    }
    .credit a { color: var(--teal); text-decoration: none; }

    /* ─── CARD ─── */
    .card {
      background: linear-gradient(160deg, rgba(21,29,82,.9), rgba(10,15,46,.95));
      border: 1px solid var(--blue-border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
    }

    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .q-num {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: var(--teal);
    }
    .q-count {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    .q-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .3px;
    }

    .q-text {
      font-family: var(--font-h);
      font-size: clamp(15px, 4.5vw, 20px);
      line-height: 1.35;
      color: var(--text);
      padding: 12px;
      background: rgba(255,255,255,.03);
      border-radius: 10px;
      border-left: 3px solid var(--teal);
    }

    /* ─── OPTIONS ─── */
    #options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      text-align: left;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid var(--blue-border);
      background: rgba(255,255,255,.04);
      color: var(--text);
      font-family: var(--font-b);
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.35;
      cursor: pointer;
      transition: all .18s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-letter {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
    }

    .btn:active { transform: scale(.98); }
    .btn.hover-state { background: rgba(255,255,255,.07); border-color: rgba(120,140,255,.3); }

    .btn.correct {
      border-color: rgba(52,211,153,.5);
      background: linear-gradient(135deg, rgba(52,211,153,.18), rgba(52,211,153,.06));
      font-weight: 700;
    }
    .btn.correct .btn-letter { background: var(--ok); color: #000; }

    .btn.wrong {
      border-color: rgba(248,113,113,.5);
      background: linear-gradient(135deg, rgba(248,113,113,.18), rgba(248,113,113,.06));
      font-weight: 700;
    }
    .btn.wrong .btn-letter { background: var(--bad); color: #000; }

    .btn.disabled { pointer-events: none; opacity: .9; }

    /* ─── BOTTOM BAR ─── */
    .bottom-bar {
      position: sticky;
      bottom: 0;
      z-index: 20;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(10,15,46,.85);
      border-top: 1px solid var(--blue-border);
      padding: 10px 16px calc(10px + var(--safe-bottom));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .bottom-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }
    .bottom-label span {
      display: block;
      font-size: 13px;
      color: var(--text);
    }

    .btn-group { display: flex; gap: 8px; }

    .action {
      padding: 11px 20px;
      border-radius: 12px;
      border: 0;
      font-family: var(--font-b);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .4px;
      cursor: pointer;
      transition: all .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .action:active { transform: scale(.96); }

    .action.primary {
      background: linear-gradient(135deg, var(--teal), #059669);
      color: #fff;
      box-shadow: 0 6px 20px rgba(45,212,191,.3);
    }
    .action.primary:disabled {
      opacity: .4;
      box-shadow: none;
    }

    .action.gold {
      background: linear-gradient(135deg, var(--gold), #f59e0b);
      color: #000;
      box-shadow: 0 6px 20px rgba(251,191,36,.25);
    }

    .action.ghost {
      background: rgba(255,255,255,.06);
      border: 1px solid var(--blue-border);
      color: var(--muted);
    }

    /* ─── MODAL ─── */
    #resultModal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(5,8,28,.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    #resultModal.show { display: flex; }

    .modal-panel {
      width: 100%;
      max-width: 600px;
      max-height: 90dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: linear-gradient(180deg, #131b55, #0d1240);
      border: 1px solid var(--blue-border);
      border-radius: 24px 24px 0 0;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: slideUp .35s cubic-bezier(.4,0,.2,1);
    }

    @media (min-width: 600px) {
      #resultModal { align-items: center; padding: 16px; }
      .modal-panel { border-radius: 24px; max-height: 88vh; }
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,.15);
      margin: 0 auto -4px;
      flex-shrink: 0;
    }

    @media (min-width: 600px) { .modal-handle { display: none; } }

    .result-title {
      font-family: var(--font-h);
      font-size: clamp(17px, 5vw, 22px);
      text-align: center;
      line-height: 1.3;
    }

    .score-big {
      text-align: center;
    }
    .score-pct {
      font-size: clamp(48px, 14vw, 72px);
      font-weight: 800;
      font-family: var(--font-h);
      background: linear-gradient(135deg, var(--gold), var(--teal));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .score-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .panel-card {
      background: rgba(255,255,255,.04);
      border: 1px solid var(--blue-border);
      border-radius: var(--radius);
      padding: 14px;
    }
    .panel-card h3 {
      font-family: var(--font-b);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .3px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 1fr 44px;
      gap: 8px;
      align-items: center;
      padding: 7px 0;
      border-top: 1px solid rgba(255,255,255,.06);
    }
    .bar-row:first-of-type { border-top: 0; }
    .bar-label { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    .bar-track { height: 7px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
    .bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--gold)); border-radius: 999px; transition: width .7s ease; }
    .bar-pct { font-size: 13px; font-weight: 800; text-align: right; }

    .summary-section { font-size: 13px; line-height: 1.6; color: var(--muted); }
    .summary-section b { color: var(--text); }
    .summary-section ul { margin: 6px 0 0 0; padding: 0; list-style: none; }
    .summary-section li { padding: 3px 0; }
    .summary-section li::before { content: '• '; color: var(--teal); }

    .modal-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .modal-actions .action { flex: 1; text-align: center; min-width: 120px; }

    /* ─── DESKTOP ─── */
    @media (min-width: 768px) {
      main { padding: 28px 40px; max-width: 860px; margin: 0 auto; width: 100%; }
      .h-logo { font-size: 17px; }
      .stat-chip { font-size: 13px; padding: 5px 14px; }
      .welcome-screen { gap: 26px; padding-top: 40px; }
      .welcome-badge { font-size: 14px; padding: 8px 22px; }
      .welcome-title { font-size: clamp(42px, 5vw, 58px); }
      .welcome-text { font-size: 16px; }
      .welcome-text li { margin-bottom: 10px; }
      .info-pill { font-size: 14px; padding: 12px 24px; }
      .info-pill strong { font-size: 26px; }
      .credit { font-size: 14px; }
      .card { padding: 30px; gap: 22px; border-radius: 20px; }
      .q-num, .q-count { font-size: 14px; }
      .q-label { font-size: 14px; }
      .q-text { font-size: clamp(19px, 2vw, 24px); padding: 20px; border-radius: 14px; line-height: 1.45; }
      #options { gap: 12px; }
      .btn { font-size: 16px; padding: 16px 20px; border-radius: 14px; gap: 14px; }
      .btn-letter { width: 32px; height: 32px; font-size: 13px; border-radius: 8px; }
      .bottom-bar { padding: 14px 40px; }
      .bottom-label { font-size: 13px; }
      .bottom-label span { font-size: 15px; }
      .action { font-size: 15px; padding: 13px 30px; border-radius: 14px; }
      .modal-panel { max-width: 680px; padding: 28px 26px; gap: 20px; }
      .result-title { font-size: clamp(20px, 2.5vw, 28px); }
      .score-pct { font-size: clamp(64px, 8vw, 96px); }
      .score-sub { font-size: 15px; }
      .panel-card { padding: 20px; }
      .panel-card h3 { font-size: 14px; margin-bottom: 16px; }
      .bar-label { font-size: 14px; }
      .bar-pct { font-size: 15px; }
      .summary-section { font-size: 15px; line-height: 1.7; }
    }
    @media (min-width: 1100px) {
      main { max-width: 960px; }
      .q-text { font-size: clamp(21px, 1.8vw, 26px); }
      .btn { font-size: 17px; }
    }


    /* PDF button — desktop only */
    #pdfBtn { display: none; }
    @media (min-width: 768px) { #pdfBtn { display: inline-flex; } }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header id="siteHeader">
    <div class="h-top">
      <div class="h-logo">Self Assessment Competenze Core ICF</div>
      <div class="h-stats">
        <div class="stat-chip ok-chip">✅ <span id="good">0</span></div>
        <div class="stat-chip bad-chip">❌ <span id="bad">0</span></div>
        <div class="stat-chip pct-chip"><span id="pct">0%</span></div>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="prog"></div></div>
  </header>

  <!-- MAIN -->
  <main id="mainContent">
    <!-- contenuto iniettato da JS -->
  </main>

  <!-- FOOTER -->
  <div class="bottom-bar" id="bottomBar">
    <div class="bottom-label">
      Obiettivo
      <span>≥ 80% ✓</span>
    </div>
    <div class="btn-group">
      <button class="action ghost" id="finishBtn" style="display:none">Termina</button>
      <button class="action primary" id="nextBtn" style="display:none" disabled>Avanti →</button>
    </div>
  </div>

  <!-- MODAL RISULTATI -->
  <section id="resultModal">
    <div class="modal-panel">
      <div class="modal-handle"></div>

      <div class="score-big">
        <div class="score-pct" id="scorePct">0%</div>
        <div class="score-sub" id="resultScore"></div>
      </div>

      <div class="result-title" id="resultTitle"></div>

      <div class="panel-card">
        <h3>📊 Per Competenza Core</h3>
        <div id="coreBars"></div>
      </div>

      <div class="panel-card">
        <h3>📌 Riepilogo</h3>
        <div id="summaryBox" class="summary-section"></div>
      </div>

      <div class="modal-actions">
        <button class="action ghost" id="restartBtn">Ricomincia</button>
        <button class="action primary" id="pdfBtn">⬇ Scarica PDF</button>
        <button class="action gold" id="closeBtn">Chiudi</button>
      </div>
    </div>
  </section>

  <script>

      ["Collabora con il cliente per definire cosa crede sia necessario considerare o risolvere per raggiungere ciò che desidera nella sessione.","Stabilisce e mantiene gli accordi"],
      ["Collabora con il cliente per definire o riconfermare le modalità di misurazione dei risultati rispetto a ciò che il cliente vuole raggiungere nel percorso di coaching o nella sessione individuale.","Stabilisce e mantiene gli accordi"],
      ["Collabora con il cliente per gestire il tempo e il focus della sessione.","Stabilisce e mantiene gli accordi"],
      ["Porta avanti il coaching nella direzione del risultato desiderato dal cliente, a meno che il cliente non indichi diversamente.","Stabilisce e mantiene gli accordi"],
      ["Collabora con il cliente per chiudere la relazione di coaching in modo che rispetti il cliente e l'esperienza di coaching","Stabilisce e mantiene gli accordi"],
      ["Rivede l'accordo di coaching quando necessario per garantire che l'approccio di coaching soddisfi le esigenze del cliente","Stabilisce e mantiene gli accordi"],
      ["Cerca di capire il cliente nel suo contesto, che può includere la sua identità, ambiente, esperienze, valori e credenze.","Coltiva fiducia e sicurezza"],
      ["Dimostra rispetto per l'identità del cliente, le sue percezioni, il suo stile e linguaggio e adatta il proprio coaching al cliente.","Coltiva fiducia e sicurezza"],
      ["Riconosce e rispetta l'unicità dei talenti, le intuizioni e il lavoro del cliente nel processo di coaching.","Coltiva fiducia e sicurezza"],
      ["Mostra supporto, empatia ed interesse per il cliente.","Coltiva fiducia e sicurezza"],
      ["Riconosce e supporta l'espressione del cliente di sentimenti, percezioni, preoccupazioni, convinzioni e impressioni.","Coltiva fiducia e sicurezza"],
      ["Dimostra apertura e trasparenza come un modo per mostrare vulnerabilità e creare fiducia con il cliente.","Coltiva fiducia e sicurezza"],
      ["Rimane focalizzato, in osservazione, empatico e in grado di adattarsi al cliente.","Mantiene la presenza"],
      ["Dimostra curiosità durante il processo di coaching.","Mantiene la presenza"],
      ["Rimane consapevole di ciò che emerge per sé stesso e per il cliente nel momento presente","Mantiene la presenza"],
      ["Gestisce le proprie emozioni per rimanere presente con il cliente.","Mantiene la presenza"],
      ["Dimostra sicurezza nel lavorare con forti emozioni del cliente durante il processo di coaching.","Mantiene la presenza"],
      ["È a suo agio nel lavorare nello spazio del \"non sapere\".","Mantiene la presenza"],
      ["Crea o lascia spazio per silenzio, pause o riflessione.","Mantiene la presenza"],
      ["Considera il contesto, l'identità, l'ambiente, le esperienze, i valori e le convinzioni del cliente per migliorare la comprensione di ciò che il cliente sta comunicando.","Ascolta attivamente"],
      ["Rispecchia o sintetizza ciò che il cliente sta comunicando per garantire chiarezza e comprensione.","Ascolta attivamente"],
      ["Riconosce ed esplora quando c'è di più oltre ciò che il cliente sta comunicando.","Ascolta attivamente"],
      ["Osserva, riconosce ed esplora le emozioni, i cambiamenti di energia, i segnali non verbali o altri comportamenti del cliente.","Ascolta attivamente"],
      ["Integra le parole, il tono della voce e il linguaggio del cliente per comprendere il significato completo di ciò che il cliente sta comunicando","Ascolta attivamente"],
      ["Nota le dinamiche dei comportamenti e delle emozioni del cliente nel corso delle sessioni per riconoscere temi generali e pattern.","Ascolta attivamente"],
      ["Considera l'esperienza del cliente quando lui decide cosa potrebbe essergli più utile.","Evoca consapevolezza"],
      ["Sfida il cliente come un modo per evocare consapevolezza o intuizione.","Evoca consapevolezza"],
      ["Pone domande sul cliente, ad esempio sul suo modo di pensare, i valori, i bisogni, i desideri e le credenze.","Evoca consapevolezza"],
      ["Fa domande che aiutano il cliente a esplorare oltre il suo pensiero attuale.","Evoca consapevolezza"],
      ["Invita il cliente a condividere di più sulla propria esperienza nel qui e ora.","Evoca consapevolezza"],
      ["Nota cosa sta funzionando per incrementare i progressi del cliente.","Evoca consapevolezza"],
      ["Adatta l'approccio di coaching in risposta alle esigenze del cliente.","Evoca consapevolezza"],
      ["Aiuta il cliente ad identificare i fattori che influenzano i modelli attuali e futuri di comportamento, pensiero o emozioni.","Evoca consapevolezza"],
      ["Invita i clienti a generare idee su come possono progredire e su ciò che sono intenzionati o in grado di fare.","Evoca consapevolezza"],
      ["Supporta il cliente a ricontestualizzare le prospettive.","Evoca consapevolezza"],
      ["Condivide senza attaccamento osservazioni, conoscenza e sentimenti, che hanno il potenziale per creare nuove intuizioni per il cliente","Evoca consapevolezza"],
      ["Lavora con il cliente per integrare nuove consapevolezze, intuizioni o apprendimenti nella sua visione del mondo e nei comportamenti.","Facilita la crescita del cliente"],
      ["Collabora con il cliente per progettare obiettivi, azioni e indicatori di responsabilità che integrano ed espandono nuovi apprendimenti.","Facilita la crescita del cliente"],
      ["Riconosce e supporta l'autonomia del cliente nella progettazione di obiettivi, azioni e metodi di responsabilità.","Facilita la crescita del cliente"],
      ["Supporta il cliente nell'identificare i risultati o l'apprendimento potenziali derivanti dalle azioni identificate.","Facilita la crescita del cliente"],
      ["Invita il cliente a considerare in che modo progredire, includendo risorse, supporti e potenziali barriere.","Facilita la crescita del cliente"],
      ["Collabora con il cliente per sintetizzare l'apprendimento e le intuizioni durante o tra le sessioni.","Facilita la crescita del cliente"],
      ["Collabora con il cliente per integrare l'apprendimento e sostenere il progresso durante tutto l'intero percorso di coaching","Facilita la crescita del cliente"],
      ["Riconosce i progressi e i successi del cliente.","Facilita la crescita del cliente"],
      ["Collabora con il cliente per chiudere la sessione.","Facilita la crescita del cliente"]
    ];

    const LETTERS = ['A','B','C','D','E','F','G','H'];
    const shuffle = arr => { const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };

    const $ = id => document.getElementById(id);
    const main     = $('mainContent');
    const nextBtn  = $('nextBtn');
    const finishBtn = $('finishBtn');
    const modal    = $('resultModal');
    const goodEl   = $('good');
    const badEl    = $('bad');
    const pctEl    = $('pct');
    const progEl   = $('prog');

    let QUESTIONS, idx, good, bad, answered, locked, welcome;
    let coreTotals={}, coreGoods={};

    function initCoreStats(){
      coreTotals={}; coreGoods={};
      CORE.forEach(c=>{ coreTotals[c]=0; coreGoods[c]=0; });
    }

    function makeQuestions(){
      return shuffle(SUB.slice()).map(([sub,core])=>{
        const options = shuffle(CORE.slice());
        return { sub, core, options, correct: options.indexOf(core) };
      });
    }

    function updateHUD(){
      const pct = answered ? Math.round((good/answered)*100) : 0;
      goodEl.textContent = good;
      badEl.textContent  = bad;
      pctEl.textContent  = pct+'%';
      progEl.style.width = Math.round((answered/QUESTIONS.length)*100)+'%';
    }

    // ── WELCOME ──────────────────────────────────────────
    function renderWelcome(){
      nextBtn.style.display  = 'none';
      finishBtn.style.display = 'none';

      main.innerHTML = `
        <div class="welcome-screen">
          <div class="welcome-badge">✦ Self Assessment Competenze Core ICF ✦</div>
          <h1 class="welcome-title">Benvenuto!</h1>
          <ul class="welcome-text">
            <li>Risponderai a <strong>68 domande</strong> sulle Competenze Core ICF</li>
            <li>Per ogni domanda scegli la Competenza Core a cui appartiene la sotto-competenza</li>
            <li>Il test si supera con almeno l'<strong>80%</strong> di risposte corrette</li>
            <li>Al termine riceverai un riepilogo dettagliato per competenza</li>
          </ul>
          <div class="info-row">
            <div class="info-pill"><strong>68</strong> Domande</div>
            <div class="info-pill"><strong>8</strong> Competenze</div>
            <div class="info-pill"><strong>80%</strong> Soglia</div>
          </div>
          <button class="action gold" id="startBtn" style="padding:15px 40px;font-size:15px;border-radius:14px">
            INIZIA IL TEST →
          </button>
          <div class="credit">
            Creato da Tito Bertasi ·
            <a href="https://www.linkedin.com/in/titobertasi1980/" target="_blank" rel="noopener">LinkedIn</a>
          </div>
        </div>`;

      $('startBtn').addEventListener('click', ()=>{
        welcome = false;
        nextBtn.style.display   = '';
        finishBtn.style.display = '';
        nextBtn.textContent = 'Avanti →';
        renderQuestion();
      }, { once: true });
    }

    // ── QUESTION ─────────────────────────────────────────
    function renderQuestion(){
      if(welcome){ renderWelcome(); return; }

      locked = false;
      nextBtn.disabled = true;

      const q = QUESTIONS[idx];

      main.innerHTML = `
        <div class="card">
          <div class="q-meta">
            <div class="q-num">Domanda ${idx+1}</div>
            <div class="q-count">${idx+1} / ${QUESTIONS.length}</div>
          </div>
          <div class="q-label">A quale competenza core appartiene questa sotto-competenza?</div>
          <div class="q-text">${q.sub}</div>
          <div id="options"></div>
        </div>`;

      if(idx === QUESTIONS.length - 1) nextBtn.textContent = 'Vedi risultato 🏁';
      else nextBtn.textContent = 'Avanti →';

      const optsBox = $('options');
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.dataset.i = i;
        btn.innerHTML = `<span class="btn-letter">${LETTERS[i]}</span>${opt}`;
        btn.addEventListener('click', ()=>{
          if(locked) return;
          locked = true;
          coreTotals[q.core]++;
          const all = optsBox.querySelectorAll('.btn');
          all.forEach(x => x.classList.add('disabled'));
          if(i === q.correct){
            btn.classList.add('correct');
            good++; coreGoods[q.core]++;
          } else {
            btn.classList.add('wrong'); bad++;
            all.forEach(x=>{ if(+x.dataset.i === q.correct) x.classList.add('correct'); });
          }
          answered++; updateHUD(); nextBtn.disabled = false;
        });
        optsBox.appendChild(btn);
      });
    }

    // ── FINISH ────────────────────────────────────────────
    function buildBars(){
      const el = $('coreBars');
      el.innerHTML = '';
      CORE.forEach(core=>{
        const tot = coreTotals[core]||0;
        const ok  = coreGoods[core]||0;
        const pct = tot ? Math.round((ok/tot)*100) : 0;
        const row = document.createElement('div');
        row.className = 'bar-row';
        row.innerHTML = `
          <div>
            <div class="bar-label">${core}</div>
            <div class="bar-track"><div class="bar-fill" style="width:0%" data-pct="${pct}"></div></div>
          </div>
          <div class="bar-pct">${pct}%</div>`;
        el.appendChild(row);
      });
      // animate
      requestAnimationFrame(()=>{
        document.querySelectorAll('.bar-fill').forEach(f=>{
          f.style.width = f.dataset.pct + '%';
        });
      });
    }

    function finish(){
      const total = QUESTIONS.length;
      const pct   = Math.round((good/total)*100);
      const passed = pct >= 80;

      $('scorePct').textContent  = pct+'%';
      $('resultScore').textContent = `Corrette: ${good} · Errate: ${bad} · Totale: ${total}`;
      $('resultTitle').textContent = passed
        ? '😎 Complimenti, hai superato il test!'
        : '😢 Non raggiunto — riprova!';

      const stats = CORE.map(c=>{
        const tot = coreTotals[c]||0;
        const ok  = coreGoods[c]||0;
        return { c, pct: tot ? (ok/tot*100) : 0 };
      }).sort((a,b)=>b.pct-a.pct);

      const strengths = stats.filter(x=>x.pct>=80);
      const toImprove = stats.filter(x=>x.pct<80).sort((a,b)=>a.pct-b.pct);

      $('summaryBox').innerHTML = `
        <div><b>Obiettivo ≥ 80%:</b> ${passed ? 'raggiunto ✅' : 'non raggiunto ❌'}</div>
        ${strengths.length ? `<div style="margin-top:10px"><b>Punti forti (≥ 80%):</b>
          <ul>${strengths.map(x=>`<li>${x.c} (${Math.round(x.pct)}%)</li>`).join('')}</ul></div>` : ''}
        ${toImprove.length ? `<div style="margin-top:10px"><b>Da rinforzare (&lt; 80%):</b>
          <ul>${toImprove.map(x=>`<li>${x.c} (${Math.round(x.pct)}%)</li>`).join('')}</ul></div>` : ''}
        <div style="margin-top:10px;opacity:.7">💡 Ripeti finché tutte le competenze restano stabili ≥ 80%.</div>`;

      buildBars();
      modal.classList.add('show');
    }

    // ── RESTART ──────────────────────────────────────────
    function restart(){
      welcome   = true;
      QUESTIONS = makeQuestions();
      idx=0; good=0; bad=0; answered=0; locked=false;
      initCoreStats();
      modal.classList.remove('show');
      updateHUD();
      renderQuestion();
    }

    // ── PDF ──────────────────────────────────────────────
    function downloadPDF(){
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      const W = doc.internal.pageSize.getWidth();
      const H = doc.internal.pageSize.getHeight();
      const mg = 16;
      const col = W - mg * 2;

      doc.setFillColor(10,15,46);
      doc.rect(0,0,W,H,'F');

      doc.setFillColor(17,26,77);
      doc.rect(0,0,W,30,'F');
      doc.setDrawColor(45,212,191);
      doc.setLineWidth(0.8);
      doc.line(0,30,W,30);

      doc.setFont('helvetica','bold');
      doc.setFontSize(7.5);
      doc.setTextColor(139,150,204);
      doc.text('SELF ASSESSMENT COMPETENZE CORE ICF', mg, 10);
      doc.setFontSize(13);
      doc.setTextColor(232,236,255);
      doc.text('Risultato del Quiz', mg, 22);
      const dateStr = new Date().toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'});
      doc.setFont('helvetica','normal');
      doc.setFontSize(7);
      doc.setTextColor(139,150,204);
      doc.text(dateStr, W-mg, 22, {align:'right'});

      const total  = QUESTIONS.length;
      const pct    = Math.round((good/total)*100);
      const passed = pct >= 80;
      const cy = 44, cr = 11;
      doc.setFillColor(21,29,82);
      doc.circle(W/2, cy, cr, 'F');
      doc.setDrawColor(passed?52:248, passed?211:113, passed?153:113);
      doc.setLineWidth(1.5);
      doc.circle(W/2, cy, cr, 'S');
      doc.setFont('helvetica','bold');
      doc.setFontSize(15);
      doc.setTextColor(232,236,255);
      doc.text(pct+'%', W/2, cy+3, {align:'center'});

      let y = cy + cr + 5;
      doc.setFontSize(8.5);
      doc.setTextColor(passed?52:248, passed?211:113, passed?153:113);
      doc.text(passed ? 'Test superato' : 'Obiettivo non raggiunto', W/2, y, {align:'center'});
      y += 5;
      doc.setFont('helvetica','normal');
      doc.setFontSize(7);
      doc.setTextColor(139,150,204);
      doc.text('Corrette: '+good+'   Errate: '+bad+'   Totale: '+total, W/2, y, {align:'center'});
      y += 8;

      doc.setFillColor(21,29,82);
      doc.roundedRect(mg, y, col, 6, 1.5, 1.5, 'F');
      doc.setFont('helvetica','bold');
      doc.setFontSize(6.5);
      doc.setTextColor(45,212,191);
      doc.text('RISULTATO PER COMPETENZA CORE', mg+3, y+4);
      y += 8.5;

      CORE.forEach(core => {
        const tot = coreTotals[core]||0;
        const ok  = coreGoods[core]||0;
        const p   = tot ? Math.round((ok/tot)*100) : 0;
        const okC = p >= 80;
        doc.setFont('helvetica','normal');
        doc.setFontSize(6.5);
        doc.setTextColor(139,150,204);
        doc.text(core, mg, y);
        const barY = y + 3;
        doc.setFillColor(30,38,90);
        doc.roundedRect(mg, barY, col-14, 2.8, 1.4, 1.4, 'F');
        const fw = (p/100)*(col-14);
        doc.setFillColor(okC?52:248, okC?211:160, okC?153:36);
        if(fw>0) doc.roundedRect(mg, barY, fw, 2.8, 1.4, 1.4, 'F');
        doc.setFont('helvetica','bold');
        doc.setFontSize(6.5);
        doc.setTextColor(okC?52:251, okC?211:191, okC?153:36);
        doc.text(p+'%', W-mg, barY+2, {align:'right'});
        y = barY + 6.2;
      });
      y += 3;

      doc.setFillColor(21,29,82);
      doc.roundedRect(mg, y, col, 6, 1.5, 1.5, 'F');
      doc.setFont('helvetica','bold');
      doc.setFontSize(6.5);
      doc.setTextColor(45,212,191);
      doc.text('RIEPILOGO', mg+3, y+4);
      y += 9;

      const stats = CORE.map(c=>({
        c, pct:(coreTotals[c]||0)?((coreGoods[c]||0)/(coreTotals[c]||1)*100):0
      })).sort((a,b)=>b.pct-a.pct);
      const strengths = stats.filter(x=>x.pct>=80);
      const toImprove = stats.filter(x=>x.pct<80).sort((a,b)=>a.pct-b.pct);

      doc.setFont('helvetica','bold');
      doc.setFontSize(7);
      doc.setTextColor(232,236,255);
      doc.text('Punti forti (>= 80%):', mg, y);
      y += 4.5;
      if(strengths.length){
        strengths.forEach(x=>{
          doc.setFont('helvetica','normal');
          doc.setFontSize(6.5);
          doc.setTextColor(52,211,153);
          const txt = doc.splitTextToSize('+ '+x.c+' ('+Math.round(x.pct)+'%)', col-4);
          doc.text(txt, mg+2, y);
          y += txt.length * 4;
        });
      } else {
        doc.setFont('helvetica','italic');
        doc.setFontSize(6.5);
        doc.setTextColor(139,150,204);
        doc.text('Nessuna ancora >= 80%', mg+2, y);
        y += 4;
      }
      y += 3;

      doc.setFont('helvetica','bold');
      doc.setFontSize(7);
      doc.setTextColor(232,236,255);
      doc.text('Da rinforzare (< 80%):', mg, y);
      y += 4.5;
      if(toImprove.length){
        toImprove.forEach(x=>{
          doc.setFont('helvetica','normal');
          doc.setFontSize(6.5);
          doc.setTextColor(248,113,113);
          const txt = doc.splitTextToSize('- '+x.c+' ('+Math.round(x.pct)+'%)', col-4);
          doc.text(txt, mg+2, y);
          y += txt.length * 4;
        });
      } else {
        doc.setFont('helvetica','italic');
        doc.setFontSize(6.5);
        doc.setTextColor(139,150,204);
        doc.text('Tutte >= 80%!', mg+2, y);
        y += 4;
      }
      y += 4;

      doc.setFont('helvetica','italic');
      doc.setFontSize(6.5);
      doc.setTextColor(100,110,160);
      const tip = doc.splitTextToSize('Suggerimento: ripeti il quiz finche tutte le competenze restano stabilmente >= 80%.', col);
      doc.text(tip, mg, y);

      doc.setFillColor(17,26,77);
      doc.rect(0,H-9,W,9,'F');
      doc.setFont('helvetica','normal');
      doc.setFontSize(6);
      doc.setTextColor(80,95,150);
      doc.text('Creato da Tito Bertasi  |  linkedin.com/in/titobertasi1980', W/2, H-3.5, {align:'center'});

      doc.save('Risultato_Quiz_ICF.pdf');
    }

    // ── EVENTS ───────────────────────────────────────────
    nextBtn.addEventListener('click', ()=>{
      if(welcome) return;
      if(idx < QUESTIONS.length-1){ idx++; renderQuestion(); }
      else finish();
    });

    finishBtn.addEventListener('click', finish);
    $('restartBtn').addEventListener('click', restart);
    $('pdfBtn').addEventListener('click', downloadPDF);
    $('closeBtn').addEventListener('click', ()=>{
      try { window.close(); } catch(e){}
      window.location.href = 'about:blank';
    });

    // ── INIT ─────────────────────────────────────────────
    welcome   = true;
    QUESTIONS = makeQuestions();
    idx=0; good=0; bad=0; answered=0; locked=false;
    initCoreStats();
    updateHUD();
    renderQuestion();

  })();
  </script>
</body>
</html>
